# Deployment proposal for review. Creating this paid service incurs Render charges.
# Deploy only for prototype validation until the production checklist is complete.
services:
  - type: web
    name: operations-desk
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: OPS_HOST
        value: 0.0.0.0
      - key: OPS_DB_PATH
        value: /var/data/operations.sqlite
      - key: OPS_SECURE_COOKIES
        value: "true"
      - key: OPS_PUBLIC_URL
        value: https://operations-desk.onrender.com
      - key: GOOGLE_WORKSPACE_EMAIL
        value: kamalb@nex3d.com
      - key: SHOPIFY_SHOP
        value: barakatbrand.myshopify.com
      - key: OPS_TOKEN_KEY
        generateValue: true
    disk:
      name: operations-data
      mountPath: /var/data
      sizeGB: 1
