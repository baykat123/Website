<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support request - Operations desk</title><link rel="stylesheet" href="/style.css"><script type="module" src="/support.js"></script></head><body><main class="login-card"><span class="eyebrow">CUSTOMER SUPPORT</span><h1>How can we help?</h1><p>Send a support or warranty request. Our team will review the details before taking action.</p><form id="support-form"><label>Your email<input name="email" type="email" required maxlength="254" autocomplete="email"></label><label>Category<select name="category"><option value="support">Support</option><option value="warranty">Warranty claim</option><option value="shipping">Shipping issue</option><option value="return">Return request</option></select></label><label>Order reference (optional)<input name="orderReference" maxlength="160"></label><label>Product serial number (optional)<input name="serialNumber" maxlength="160"></label><label>Subject<input name="subject" required maxlength="160"></label><label>Details<textarea name="details" required maxlength="10000" rows="6"></textarea></label><label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button>Submit request</button></form><p id="support-status" role="status" aria-live="polite"></p></main></body></html>
